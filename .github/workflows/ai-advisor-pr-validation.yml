name: AI Advisor PR validation (no deployment)

on:
  workflow_dispatch: # Validation only; permits exact-main CI before a separately approved release.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  checks: read # Verify real Checks API access with this job's GITHUB_TOKEN.

concurrency:
  group: independent-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: AI Advisor independent validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Offline golden tests require their pinned historical baseline.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Metadata probe security regressions (offline, no secrets)
        run: node --test tests/public-release-metadata-probe.test.mjs
      - name: Focused Advisor and release safety regressions
        run: npm run test:advisor
      - name: Text-first schema, authorization, revisions and receipt regressions
        run: node --test --experimental-strip-types tests/ai-text-documents.test.ts
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Worker typecheck
        run: npm run cf:typecheck
      - name: Build frontend without deploying
        run: npm run build
      - name: Text-first local browser acceptance (no provider or deployment)
        run: node --test --experimental-strip-types tests/ai-text-documents.browser.test.ts
      - name: Build isolated OCR review UI without deploying
        run: npx vite build --config staging/advisor/vite.config.mjs
      - name: Full offline/local suite
        run: |
          npm test
          node --test scripts/hub-roster-parser.test.mjs tools/hub-devtools-snippets/hk1-course-schedule-audit.test.mjs
      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD
      - name: Verify real GitHub Actions read-only CI credentials (not release approval)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-github-ci-read-access.mjs
