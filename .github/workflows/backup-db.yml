name: Tự động sao lưu Supabase lên Cloudflare R2

on:
  schedule:
    # Chạy tự động mỗi ngày một lần, khoảng 02:00 giờ Việt Nam
    - cron: '0 19 * * *'
  workflow_dispatch: # Cho phép sếp bấm nút chạy bằng tay bất cứ lúc nào

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Cài đặt đồ nghề (PostgreSQL Client 17)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: 2. Lấy mốc thời gian hiện tại
        id: date
        run: echo "CURRENT_DATE=$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_ENV

      - name: 3. Rút ruột Database và nén lại (.sql.gz)
        run: |
          # Thêm --column-inserts để nó tạo file siêu thân thiện
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_URL }}" --column-inserts > dump.sql
          
          # Xong mới đem đi nén
          gzip -c dump.sql > hubplanner_backup_${{ env.CURRENT_DATE }}.sql.gz

      - name: 4. Chở hàng sang kho Cloudflare R2 cất giấu
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp hubplanner_backup_${{ env.CURRENT_DATE }}.sql.gz s3://${{ secrets.R2_BUCKET_NAME }}/database_backups/hubplanner_backup_${{ env.CURRENT_DATE }}.sql.gz --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: 5. Cleanup old database backups on R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          BACKUP_PREFIX: database_backups/
          KEEP_BACKUPS: "3"
        run: |
          set -euo pipefail

          backups=$(aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET" \
            --prefix "$BACKUP_PREFIX" \
            --endpoint-url "$R2_ENDPOINT" \
            --query 'sort_by(Contents || `[]`, &LastModified)[].Key' \
            --output text)

          if [ -z "$backups" ] || [ "$backups" = "None" ]; then
            echo "No backups found to clean."
            exit 0
          fi

          total=$(printf '%s\n' $backups | sed '/^$/d' | wc -l)
          delete_count=$((total - KEEP_BACKUPS))

          if [ "$delete_count" -le 0 ]; then
            echo "Found $total backup(s), keeping all."
            exit 0
          fi

          printf '%s\n' $backups | sed '/^$/d' | head -n "$delete_count" | while read -r key; do
            echo "Deleting old backup: $key"
            aws s3 rm "s3://$R2_BUCKET/$key" --endpoint-url "$R2_ENDPOINT"
          done
