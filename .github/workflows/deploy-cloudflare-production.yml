name: Approved Public-only production release

on:
  workflow_dispatch:
    inputs:
      approve_public_release:
        description: Explicit Public-only release request (not Auth, migration or backfill)
        type: boolean
        required: true
        default: false
      approved_sha:
        description: Full 40-character main HEAD SHA approved separately
        type: string
        required: true

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # Read protected environment metadata; no deployment/admin write grant.

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.approve_public_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify owner dispatch, current main SHA and protected environment (not final approval)
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-public-release-approval.mjs --preflight

      - run: npm run test:advisor
      - run: npm run typecheck
      - run: npm run cf:typecheck

      - name: Run full test suite
        run: |
          npm test
          node --test scripts/hub-roster-parser.test.mjs tools/hub-devtools-snippets/hk1-course-schedule-audit.test.mjs

      - name: Build frontend assets
        run: npm run build

      - run: git diff --check HEAD^ HEAD

  release-public:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: public-production
    permissions:
      contents: read
      actions: read
      checks: read # Short-lived GITHUB_TOKEN only; PAT does not need Checks.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify live settings and schema without applying migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PUBLIC_RELEASE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PUBLIC_RELEASE_CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-public-release-state.mjs

      # Final mandatory guard immediately before deploy; there is no bypass input.
      - name: Verify solo owner approval, live protections and exact-SHA CI
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_GITHUB_READ_TOKEN: ${{ secrets.PUBLIC_RELEASE_GITHUB_READ_TOKEN }}
        run: node scripts/check-public-release-approval.mjs

      - name: Deploy Public Worker and frontend assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PUBLIC_RELEASE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PUBLIC_RELEASE_CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config cloudflare/wrangler.jsonc --keep-vars
